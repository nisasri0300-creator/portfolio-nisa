<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nisa Sri Fadilah - Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F7F4EE;
            color: #1A202C;
            overflow-x: hidden;
        }
        .hero-bg {
            background-image: url('hero.jpg'); /* Ganti dengan nama file foto kamu */
            background-size: cover;
            background-position: center 20%;
        }
        #role-text {
            transition: opacity 0.3s ease-in-out;
        }
    </style>
</head>
<body class="relative min-h-screen flex bg-[#F7F4EE]">

    <!-- Sidebar / Drawer Navigasi (Gaya High-End Editorial) -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-80 bg-[#F4EFE6] border-r border-[#E5DDC9] flex flex-col justify-between p-10 transition-all duration-300 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
        <div>
            <!-- Header Sidebar -->
            <div class="flex items-center justify-between mb-12">
                <span class="text-[10px] uppercase tracking-[0.3em] text-slate-400 font-bold">NAVIGATION</span>
                <button onclick="toggleSidebar()" class="w-8 h-8 rounded-full hover:bg-[#E8E1D3] flex items-center justify-center text-slate-400 hover:text-slate-700 transition-colors">✕</button>
            </div>
            
            <!-- Profil Singkat di Sidebar -->
            <div class="flex flex-col items-center text-center mb-10 pb-8 border-b border-[#E8E1D3]">
                <img src="profile.jpg" alt="Profile" class="w-20 h-20 rounded-full object-cover shadow-sm mb-4 border-2 border-white">
                <h3 class="font-bold text-slate-900 text-lg tracking-tight">Nisa Sri Fadilah</h3>
                <p class="text-[10px] uppercase tracking-[0.25em] text-slate-400 font-semibold mt-1">CREATIVE DIRECTOR</p>
            </div>

            <!-- Menu List (Clean, Elegan, Tanpa Garis Kaku) -->
            <nav class="space-y-2">
                <!-- Home (Aktif: Background Halus & Elegan) -->
                <a href="#" class="flex items-center gap-4 px-4 py-3.5 bg-[#EAE2D2]/60 text-slate-900 rounded-xl font-semibold text-sm transition-all shadow-sm">
                    <svg class="w-4 h-4 text-slate-900" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    Home
                </a>
                <!-- Creative (Penggabungan Logo & Branding Showcase) -->
                <a href="#" class="flex items-center gap-4 px-4 py-3.5 text-slate-500 hover:text-slate-900 hover:bg-[#EAE2D2]/30 rounded-xl font-medium text-sm transition-all">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    Creative
                </a>
                <!-- Projects -->
                <a href="#" class="flex items-center gap-4 px-4 py-3.5 text-slate-500 hover:text-slate-900 hover:bg-[#EAE2D2]/30 rounded-xl font-medium text-sm transition-all">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
                    Projects
                </a>
                <!-- About Me -->
                <a href="#" class="flex items-center gap-4 px-4 py-3.5 text-slate-500 hover:text-slate-900 hover:bg-[#EAE2D2]/30 rounded-xl font-medium text-sm transition-all">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    About Me
                </a>
            </nav>
        </div>

        <!-- Tombol Download Resume di Bawah Sidebar (Lebih Lembut & Mewah) -->
        <div>
            <a href="#" class="flex items-center justify-between w-full px-5 py-3.5 bg-white/70 hover:bg-white border border-[#E5DDC9] rounded-xl text-slate-800 font-semibold text-xs tracking-widest transition-all shadow-sm">
                <span>DOWNLOAD RESUME</span>
                <span>↓</span>
            </a>
        </div>
    </aside>

    <!-- Tombol Menu Hamburger (Muncul jika sidebar ditutup) -->
    <button id="menu-btn" onclick="toggleSidebar()" class="fixed top-6 left-6 z-40 w-12 h-12 bg-white/90 hover:bg-white backdrop-blur-md rounded-full items-center justify-center shadow-md transition-all hidden border border-slate-200">
        <svg class="w-5 h-5 text-slate-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>

    <!-- Main Hero Section -->
    <main id="main-content" class="relative flex-1 h-screen hero-bg flex flex-col items-center justify-end pb-16 px-4 ml-80 transition-all duration-300 overflow-hidden">
        
        <!-- Konten Nama & Title -->
        <div class="relative z-10 text-center max-w-4xl mx-auto flex flex-col items-center mb-6">
            <!-- Nama Besar -->
            <h1 class="text-3xl sm:text-5xl md:text-6xl font-black tracking-widest text-[#121c2e] uppercase drop-shadow-[0_2px_10px_rgba(255,255,255,0.9)] mb-3">
                NISA SRI FADILAH
            </h1>

            <!-- Pill Badge Subtitle Berganti Otomatis -->
            <div class="inline-flex items-center px-6 py-2 bg-white/95 backdrop-blur-md rounded-full shadow-sm border border-white/60">
                <span id="role-text" class="text-xs sm:text-sm font-bold tracking-widest text-slate-800 uppercase">
                    INDUSTRIAL ENGINEERING
                </span>
            </div>
        </div>

    </main>

    <!-- Script Pendukung Interaksi -->
    <script>
        let isSidebarOpen = true;

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            const menuBtn = document.getElementById('menu-btn');

            isSidebarOpen = !isSidebarOpen;

            if (isSidebarOpen) {
                sidebar.classList.remove('-translate-x-full');
                mainContent.classList.add('ml-80');
                menuBtn.classList.remove('flex');
                menuBtn.classList.add('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                mainContent.classList.remove('ml-80');
                menuBtn.classList.remove('hidden');
                menuBtn.classList.add('flex');
            }
        }

        // Animasi Teks Berganti pada Pill Badge
        const roles = [
            "INDUSTRIAL ENGINEERING",
            "EDUCATION TEACHER",
            "E-COMMERCE SPECIALIST",
            "DIGITAL MARKETING"
        ];
        let currentRoleIndex = 0;

        setInterval(() => {
            currentRoleIndex = (currentRoleIndex + 1) % roles.length;
            const roleElement = document.getElementById('role-text');
            if (roleElement) {
                roleElement.style.opacity = '0';
                setTimeout(() => {
                    roleElement.textContent = roles[currentRoleIndex];
                    roleElement.style.opacity = '1';
                }, 200);
            }
        }, 3500);
    </script>
</body>
</html>
