<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nisa Sri Fadilah - Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F7F4EE;
            color: #1A202C;
            overflow-x: hidden;
        }
        .hero-bg {
            background-image: url('hero.jpg'); /* Ganti dengan nama file foto kamu */
            background-size: cover;
            background-position: center 20%;
        }
        #role-text {
            transition: opacity 0.4s ease-in-out;
        }
    </style>
</head>
<body class="relative min-h-screen flex bg-[#F7F4EE]">

    <!-- Sidebar Desktop (Elegan, Minimalis, High-End Editorial) -->
    <aside id="sidebar" class="hidden md:flex fixed inset-y-0 left-0 z-50 w-80 bg-[#F4EFE6] border-r border-[#E8E1D5] flex-col justify-between p-10 transition-all duration-300">
        <div>
            <!-- Header Brand / Nama di Sidebar -->
            <div class="mb-14">
                <h2 class="text-xs uppercase tracking-[0.35em] text-slate-400 font-semibold mb-2">PORTFOLIO</h2>
                <h1 class="text-xl font-medium tracking-tight text-slate-900">Nisa Sri Fadilah</h1>
                <p class="text-[10px] uppercase tracking-[0.25em] text-slate-400 mt-1 font-medium">Creative Director</p>
            </div>

            <!-- Menu List (Gaya Minimalis Bersih, Tanpa Kotak Kasar) -->
            <nav class="space-y-4">
                <!-- Home (Aktif: Teks tebal & garis indikator halus di kiri) -->
                <a href="#" class="relative flex items-center gap-4 text-slate-900 font-semibold text-sm tracking-wide transition-all group py-1">
                    <span class="absolute -left-6 w-1 h-4 bg-slate-900 rounded-r-full"></span>
                    <span>Home</span>
                </a>
                <!-- Creative -->
                <a href="#" class="flex items-center gap-4 text-slate-400 hover:text-slate-900 font-normal text-sm tracking-wide transition-all py-1">
                    <span>Creative</span>
                </a>
                <!-- Projects -->
                <a href="#" class="flex items-center gap-4 text-slate-400 hover:text-slate-900 font-normal text-sm tracking-wide transition-all py-1">
                    <span>Projects</span>
                </a>
                <!-- About Me -->
                <a href="#" class="flex items-center gap-4 text-slate-400 hover:text-slate-900 font-normal text-sm tracking-wide transition-all py-1">
                    <span>About Me</span>
                </a>
            </nav>
        </div>

        <!-- Tombol Download Resume di Bawah Sidebar (Sangat Ramping & Mewah) -->
        <div>
            <a href="#" class="inline-flex items-center justify-between w-full text-slate-800 hover:text-slate-900 font-medium text-xs tracking-[0.2em] uppercase pb-2 border-b border-slate-300 hover:border-slate-900 transition-all">
                <span>Download Resume</span>
                <span>↓</span>
            </a>
        </div>
    </aside>

    <!-- Mobile Top Header (Khusus Tampilan HP) -->
    <div class="md:hidden fixed top-0 inset-x-0 z-40 bg-[#F4EFE6]/90 backdrop-blur-md border-b border-[#E8E1D5] px-6 py-4 flex items-center justify-between">
        <span class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-800">Nisa Sri Fadilah</span>
        <a href="#" class="text-[10px] font-medium uppercase tracking-widest text-slate-600 border-b border-slate-400 pb-0.5">Resume ↓</a>
    </div>

    <!-- Main Hero Section (Foto Tetap Tajam, Elegan) -->
    <main id="main-content" class="relative flex-1 h-screen hero-bg flex flex-col items-center justify-end pb-20 md:pb-16 px-4 md:ml-80 transition-all duration-300 overflow-hidden">
        
        <!-- Konten Nama & Title -->
        <div class="relative z-10 text-center max-w-4xl mx-auto flex flex-col items-center mb-4">
            <!-- Nama Besar -->
            <h1 class="text-3xl sm:text-5xl md:text-6xl font-light tracking-[0.2em] text-[#121c2e] uppercase drop-shadow-[0_2px_12px_rgba(255,255,255,0.8)] mb-4">
                NISA SRI FADILAH
            </h1>

            <!-- Pill Badge Subtitle (Ivory Sangat Lembut & Menyatu) -->
            <div class="inline-flex items-center px-6 py-2 bg-[#FBF9F5]/90 backdrop-blur-md rounded-full shadow-sm border border-[#EBE4D5]">
                <span id="role-text" class="text-xs sm:text-sm font-medium tracking-[0.25em] text-slate-700 uppercase">
                    INDUSTRIAL ENGINEERING
                </span>
            </div>
        </div>

    </main>

    <!-- Mobile Bottom Navigation Bar (Khusus Tampilan HP: Elegan di Bawah) -->
    <nav class="md:hidden fixed bottom-0 inset-x-0 z-50 bg-[#F4EFE6]/95 backdrop-blur-md border-t border-[#E8E1D5] px-6 py-4 flex items-center justify-around">
        <a href="#" class="text-xs font-semibold text-slate-950 uppercase tracking-widest">Home</a>
        <a href="#" class="text-xs font-normal text-slate-400 hover:text-slate-900 uppercase tracking-widest transition-colors">Creative</a>
        <a href="#" class="text-xs font-normal text-slate-400 hover:text-slate-900 uppercase tracking-widest transition-colors">Projects</a>
        <a href="#" class="text-xs font-normal text-slate-400 hover:text-slate-900 uppercase tracking-widest transition-colors">About</a>
    </nav>

    <!-- Script Pendukung Interaksi -->
    <script>
        // Animasi Teks Berganti pada Pill Badge
        const roles = [
            "INDUSTRIAL ENGINEERING",
            "EDUCATION TEACHER",
            "E-COMMERCE SPECIALIST",
            "DIGITAL MARKETING"
        ];
        let currentRoleIndex = 0;

        setInterval(() => {
            currentRoleIndex = (currentRoleIndex + 1) % roles.length;
            const roleElement = document.getElementById('role-text');
            if (roleElement) {
                roleElement.style.opacity = '0';
                setTimeout(() => {
                    roleElement.textContent = roles[currentRoleIndex];
                    roleElement.style.opacity = '1';
                }, 200);
            }
        }, 3500);
    </script>
</body>
</html>
