<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nisa Sri Fadilah - Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FBF9F5; /* Nuansa Ivory */
            color: #2D3748;
            overflow-x: hidden;
        }
        .hero-bg {
            background-image: url('hero.jpg'); /* Ganti dengan nama file foto kamu */
            background-size: cover;
            background-position: center 20%;
            transition: filter 0.3s ease-in-out;
        }
        #role-text {
            transition: opacity 0.3s ease-in-out;
        }
    </style>
</head>
<body class="relative min-h-screen flex bg-[#FBF9F5]">

    <!-- Overlay Blur pada Hero ketika Sidebar Terbuka -->
    <div id="hero-overlay" class="fixed inset-0 z-30 pointer-events-none transition-all duration-300"></div>

    <!-- Sidebar / Drawer Navigasi (Nuansa Ivory & Gaya Gambar 1) -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-80 bg-[#F5F2EB] border-r border-[#EAE3D2] shadow-sm flex flex-col justify-between p-6 transition-all duration-300">
        <div>
            <!-- Header Sidebar (Teks NAVIGATION & Tombol Tutup X) -->
            <div class="flex items-center justify-between mb-6">
                <span class="text-[11px] uppercase tracking-widest text-slate-400 font-bold">NAVIGATION</span>
                <button onclick="toggleSidebar()" class="w-7 h-7 rounded-full bg-[#EAE3D2]/50 hover:bg-[#EAE3D2] flex items-center justify-center text-slate-600 font-bold text-sm transition-colors">✕</button>
            </div>
            
            <!-- Profil Singkat di Sidebar (Gaya Gambar 1: Foto Bulat + Nama + CREATIVE DIRECTOR) -->
            <div class="flex flex-col items-center text-center mb-6 pb-6 border-b border-[#EAE3D2]">
                <img src="profile.jpg" alt="Profile" class="w-16 h-16 rounded-full object-cover shadow-sm mb-2.5 border-2 border-white">
                <h3 class="font-bold text-slate-900 text-base">Nisa Sri Fadilah</h3>
                <p class="text-[10px] uppercase tracking-widest text-slate-400 font-semibold mt-0.5">CREATIVE DIRECTOR</p>
            </div>

            <!-- Menu List dengan Card Putih Bersih ala Gambar 1 -->
            <nav class="space-y-2.5">
                <!-- Home (Aktif: Background Gelap) -->
                <a href="#" class="flex items-center gap-3.5 px-4 py-3 bg-[#121c2e] text-white rounded-xl font-medium text-sm shadow-sm transition-all">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    Home
                </a>
                <!-- Logo Gallery -->
                <a href="#" class="flex items-center gap-3.5 px-4 py-3 bg-white hover:bg-[#FAF8F3] text-slate-700 rounded-xl font-medium text-sm shadow-sm border border-[#EAE3D2]/40 transition-all">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    Logo Gallery
                </a>
                <!-- Branding Showcase -->
                <a href="#" class="flex items-center gap-3.5 px-4 py-3 bg-white hover:bg-[#FAF8F3] text-slate-700 rounded-xl font-medium text-sm shadow-sm border border-[#EAE3D2]/40 transition-all">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                    Branding Showcase
                </a>
                <!-- Projects -->
                <a href="#" class="flex items-center gap-3.5 px-4 py-3 bg-white hover:bg-[#FAF8F3] text-slate-700 rounded-xl font-medium text-sm shadow-sm border border-[#EAE3D2]/40 transition-all">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
                    Projects
                </a>
                <!-- About Me -->
                <a href="#" class="flex items-center gap-3.5 px-4 py-3 bg-white hover:bg-[#FAF8F3] text-slate-700 rounded-xl font-medium text-sm shadow-sm border border-[#EAE3D2]/40 transition-all">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    About Me
                </a>
            </nav>
        </div>

        <!-- Tombol Download Resume di Bawah Sidebar -->
        <div>
            <a href="#" class="flex items-center justify-between w-full px-4 py-3 bg-white hover:bg-[#FAF8F3] border border-[#EAE3D2] rounded-xl text-slate-800 font-medium text-sm shadow-sm transition-colors">
                <span>Download Resume</span>
                <span>↓</span>
            </a>
        </div>
    </aside>

    <!-- Tombol Menu Hamburger (Muncul jika sidebar ditutup) -->
    <button id="menu-btn" onclick="toggleSidebar()" class="fixed top-6 left-6 z-40 w-12 h-12 bg-white/90 hover:bg-white backdrop-blur-md rounded-full items-center justify-center shadow-md transition-all hidden">
        <svg class="w-6 h-6 text-slate-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>

    <!-- Main Hero Section (Otomatis Blur ketika Sidebar Terbuka) -->
    <main id="main-content" class="relative flex-1 h-screen hero-bg flex flex-col items-center justify-end pb-16 px-4 ml-80 transition-all duration-300 overflow-hidden">
        
        <!-- Konten Nama & Title -->
        <div class="relative z-10 text-center max-w-4xl mx-auto flex flex-col items-center mb-6">
            <!-- Nama Besar dengan Drop Shadow -->
            <h1 class="text-3xl sm:text-5xl md:text-6xl font-black tracking-widest text-[#121c2e] uppercase drop-shadow-[0_2px_10px_rgba(255,255,255,0.8)] mb-3">
                NISA SRI FADILAH
            </h1>

            <!-- Pill Badge Subtitle Berganti Otomatis -->
            <div class="inline-flex items-center px-6 py-2 bg-white/95 backdrop-blur-md rounded-full shadow-md border border-white/40">
                <span id="role-text" class="text-xs sm:text-sm font-bold tracking-widest text-slate-800 uppercase">
                    INDUSTRIAL ENGINEERING
                </span>
            </div>
        </div>

    </main>

    <!-- Script Pendukung Interaksi & Efek Blur -->
    <script>
        let isSidebarOpen = true;

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            const heroOverlay = document.getElementById('hero-overlay');
            const menuBtn = document.getElementById('menu-btn');

            isSidebarOpen = !isSidebarOpen;

            if (isSidebarOpen) {
                sidebar.classList.remove('-translate-x-full');
                mainContent.classList.add('ml-80');
                mainContent.style.filter = 'blur(3px)';
                heroOverlay.classList.add('bg-black/10', 'backdrop-blur-[2px]');
                menuBtn.classList.remove('flex');
                menuBtn.classList.add('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                mainContent.classList.remove('ml-80');
                mainContent.style.filter = 'none';
                heroOverlay.classList.remove('bg-black/10', 'backdrop-blur-[2px]');
                menuBtn.classList.remove('hidden');
                menuBtn.classList.add('flex');
            }
        }

        // Jalankan efek blur di awal karena sidebar default-nya terbuka
        document.getElementById('main-content').style.filter = 'blur(3px)';
        document.getElementById('hero-overlay').classList.add('bg-black/10', 'backdrop-blur-[2px]');

        // Animasi Teks Berganti pada Pill Badge
        const roles = [
            "INDUSTRIAL ENGINEERING",
            "EDUCATION TEACHER",
            "E-COMMERCE SPECIALIST",
            "DIGITAL MARKETING"
        ];
        let currentRoleIndex = 0;

        setInterval(() => {
            currentRoleIndex = (currentRoleIndex + 1) % roles.length;
            const roleElement = document.getElementById('role-text');
            if (roleElement) {
                roleElement.style.opacity = '0';
                setTimeout(() => {
                    roleElement.textContent = roles[currentRoleIndex];
                    roleElement.style.opacity = '1';
                }, 200);
            }
        }, 3500);
    </script>
</body>
</html>
