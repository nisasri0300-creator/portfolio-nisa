<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nisa Sri Fadilah - Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fcfbfa;
            color: #1e293b;
            overflow-x: hidden;
        }
        .hero-bg {
            background-image: url('hero.jpg'); /* Ganti dengan nama file foto kamu */
            background-size: cover;
            background-position: center 30%; /* Mengatur posisi vertikal wajah agar pas di atas teks */
        }
    </style>
</head>
<body class="relative min-h-screen flex flex-col justify-between">

    <!-- Tombol Menu Hamburger (Kiri Atas) -->
    <button onclick="toggleSidebar()" class="absolute top-6 left-6 z-30 w-12 h-12 bg-white/80 hover:bg-white backdrop-blur-md rounded-full flex items-center justify-center shadow-md transition-all">
        <svg class="w-6 h-6 text-slate-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>

    <!-- Sidebar / Drawer Navigasi -->
    <div id="sidebar" class="fixed inset-y-0 left-0 z-50 w-80 bg-[#f8f5ee] shadow-2xl transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col justify-between p-6">
        <div>
            <div class="flex items-center justify-between mb-8">
                <span class="text-xs uppercase tracking-widest text-slate-400 font-semibold">Navigation</span>
                <button onclick="toggleSidebar()" class="w-8 h-8 rounded-full bg-slate-200/60 hover:bg-slate-200 flex items-center justify-center text-slate-600 font-bold">✕</button>
            </div>
            
            <!-- Profil Singkat di Sidebar -->
            <div class="flex flex-col items-center text-center mb-8 pb-6 border-b border-slate-200/60">
                <img src="profile.jpg" alt="Profile" class="w-20 h-20 rounded-full object-cover shadow-sm mb-3">
                <h3 class="font-bold text-slate-900 text-lg">Nisa Sri Fadilah</h3>
                <p class="text-xs uppercase tracking-wider text-slate-500 font-medium">Creative Director</p>
            </div>

            <!-- Menu List -->
            <nav class="space-y-2">
                <a href="#" class="flex items-center gap-4 px-4 py-3 bg-[#1e293b] text-white rounded-xl font-medium shadow-sm">
                    <span>🏠</span> Home
                </a>
                <a href="#" class="flex items-center gap-4 px-4 py-3 hover:bg-slate-200/50 text-slate-700 rounded-xl font-medium transition-colors">
                    <span>🎨</span> Logo Gallery
                </a>
                <a href="#" class="flex items-center gap-4 px-4 py-3 hover:bg-slate-200/50 text-slate-700 rounded-xl font-medium transition-colors">
                    <span>📦</span> Branding Showcase
                </a>
                <a href="#" class="flex items-center gap-4 px-4 py-3 hover:bg-slate-200/50 text-slate-700 rounded-xl font-medium transition-colors">
                    <span>📁</span> Projects
                </a>
                <a href="#" class="flex items-center gap-4 px-4 py-3 hover:bg-slate-200/50 text-slate-700 rounded-xl font-medium transition-colors">
                    <span>👤</span> About Me
                </a>
            </nav>
        </div>

        <!-- Tombol Download Resume di Bawah Sidebar -->
        <div>
            <a href="#" class="flex items-center justify-between w-full px-4 py-3 bg-[#f3efe6] hover:bg-[#eae4d5] border border-slate-300/40 rounded-xl text-slate-800 font-medium text-sm transition-colors">
                <span>Download Resume</span>
                <span>↓</span>
            </a>
        </div>
    </div>

    <!-- Backdrop untuk Sidebar -->
    <div id="backdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300"></div>

    <!-- Main Hero Section (Full Screen) -->
    <main class="relative w-full h-screen hero-bg flex flex-col items-center justify-end pb-16 px-4">
        
        <!-- Overlay tipis agar teks lebih kontras dan terbaca jelas -->
        <div class="absolute inset-0 bg-gradient-to-t from-black/20 via-transparent to-transparent pointer-events-none"></div>

        <!-- Konten Nama & Title (Diposisikan di area bawah/baju agar wajah bersih) -->
        <div class="relative z-10 text-center max-w-4xl mx-auto flex flex-col items-center">
            <!-- Nama Besar -->
            <h1 class="text-3xl sm:text-5xl md:text-6xl font-black tracking-widest text-[#121c2e] uppercase drop-shadow-sm mb-3">
                NISA SRI FADILAH
            </h1>

            <!-- Pill Badge Subtitle yang Berganti Otomatis -->
            <div class="inline-flex items-center px-5 py-2 bg-white/90 backdrop-blur-md rounded-full shadow-md border border-white/40">
                <span id="role-text" class="text-xs sm:text-sm font-bold tracking-widest text-slate-800 uppercase">
                    DIGITAL MARKETING LEAD
                </span>
            </div>
        </div>

        <!-- Tombol Navigasi Kiri & Kanan Bawah -->
        <button onclick="prevSlide()" class="absolute left-6 bottom-1/2 translate-y-1/2 w-12 h-12 bg-white/80 hover:bg-white backdrop-blur-md rounded-full flex items-center justify-center shadow-md transition-all text-slate-800">
            ←
        </button>
        <button onclick="nextSlide()" class="absolute right-6 bottom-1/2 translate-y-1/2 w-12 h-12 bg-white/80 hover:bg-white backdrop-blur-md rounded-full flex items-center justify-center shadow-md transition-all text-slate-800">
            →
        </button>

        <!-- Indicator Bar (Pill Slider Dots di Bawah Tengah) -->
        <div class="absolute bottom-6 z-10 flex items-center gap-2 bg-white/70 backdrop-blur-md px-4 py-2 rounded-full shadow-sm">
            <span class="w-6 h-1.5 bg-slate-900 rounded-full transition-all"></span>
            <span class="w-1.5 h-1.5 bg-slate-400 rounded-full hover:bg-slate-700 transition-all cursor-pointer"></span>
            <span class="w-1.5 h-1.5 bg-slate-400 rounded-full hover:bg-slate-700 transition-all cursor-pointer"></span>
            <span class="w-1.5 h-1.5 bg-slate-400 rounded-full hover:bg-slate-700 transition-all cursor-pointer"></span>
        </div>

    </main>

    <!-- Script Pendukung Interaksi -->
    <script>
        // Fungsi Buka/Tutup Sidebar
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('backdrop');
            
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
                setTimeout(() => backdrop.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('opacity-0');
                setTimeout(() => backdrop.classList.add('hidden'), 300);
            }
        }

        // Animasi Teks Berganti pada Pill Badge
        const roles = [
            "DIGITAL MARKETING LEAD",
            "CREATIVE DIRECTOR",
            "BRAND STRATEGIST",
            "UI/UX DESIGNER"
        ];
        let currentRoleIndex = 0;

        setInterval(() => {
            currentRoleIndex = (currentRoleIndex + 1) % roles.length;
            const roleElement = document.getElementById('role-text');
            if (roleElement) {
                roleElement.style.opacity = '0';
                setTimeout(() => {
                    roleElement.textContent = roles[currentRoleIndex];
                    roleElement.style.opacity = '1';
                }, 200);
            }
        }, 3500);

        function prevSlide() {
            // Logika slide sebelumnya bisa ditambahkan di sini
        }

        function nextSlide() {
            // Logika slide berikutnya bisa ditambahkan di sini
        }
    </script>
</body>
</html>
