<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nisa Sri Fadilah - Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom Styling untuk Tombol Navigasi Dark Mode */
        .nav-btn {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #E2E8F0;
            transition: all 0.2s ease-in-out;
        }

        .nav-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            color: #FFFFFF;
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="bg-[#0B132B] text-white min-h-screen flex items-center justify-center p-0 md:p-6">

    <!-- Container Utama Full Screen / Card View -->
    <div class="w-full max-w-[1280px] min-h-screen md:min-h-[650px] bg-[#0F172A] md:rounded-2xl overflow-hidden shadow-2xl grid grid-cols-1 md:grid-cols-12 border border-slate-800">
        
        <!-- Sisi Kiri: Sidebar Navigasi Dark Theme -->
        <div class="md:col-span-4 lg:col-span-3 bg-[#0B1120] p-6 flex flex-col justify-between items-center text-center border-r border-slate-800/80">
            
            <div class="w-full flex flex-col items-center">
                <!-- Icon Hamburger Menu (Kiri Atas) -->
                <div class="w-full flex justify-start mb-4">
                    <button class="text-slate-400 hover:text-white transition">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                </div>

                <!-- Foto Profil Bulat -->
                <div class="w-20 h-20 rounded-full overflow-hidden mb-3 ring-2 ring-slate-700 shadow-lg">
                    <img src="profile.jpg" alt="Nisa Sri Fadilah" class="w-full h-full object-cover">
                </div>

                <!-- Nama Lengkap -->
                <h1 class="text-lg font-bold text-slate-100 tracking-tight">Nisa Sri Fadilah</h1>
                
                <!-- Social Media Icons -->
                <div class="flex space-x-3 my-3 text-slate-400">
                    <a href="https://github.com/username" target="_blank" class="hover:text-white transition text-sm"><i class="fa-brands fa-github"></i></a>
                    <a href="https://linkedin.com/in/username" target="_blank" class="hover:text-white transition text-sm"><i class="fa-brands fa-linkedin-in"></i></a>
                    <a href="https://instagram.com/username" target="_blank" class="hover:text-white transition text-sm"><i class="fa-brands fa-instagram"></i></a>
                </div>

                <!-- Subtitle / Intro Singkat -->
                <p class="text-[11px] text-slate-400 max-w-[210px] mb-6 leading-relaxed">
                    Hi, Nisa here. Check my other pages or download my CV below.
                </p>

                <!-- Tombol-tombol Navigasi Utama -->
                <div class="w-full space-y-2.5 max-w-[220px]">
                    <a href="link-cv-kamu.pdf" target="_blank" class="nav-btn block w-full py-2 text-xs font-medium rounded-lg text-center">
                        View CV
                    </a>
                    <a href="https://drive.google.com/..." target="_blank" class="nav-btn block w-full py-2 text-xs font-medium rounded-lg text-center">
                        Portfolio
                    </a>
                    <a href="#projects" class="nav-btn block w-full py-2 text-xs font-medium rounded-lg text-center">
                        Projects
                    </a>
                    <a href="#about" class="nav-btn block w-full py-2 text-xs font-medium rounded-lg text-center">
                        About
                    </a>
                </div>
            </div>

            <!-- Footer / Copyright -->
            <div class="mt-8 text-[10px] text-slate-500">
                2026 made by Nisa
            </div>
        </div>

        <!-- Sisi Kanan: Hero Banner dengan Dark Overlay & Headline Teks -->
        <div class="md:col-span-8 lg:col-span-9 relative min-h-[400px] md:min-h-full bg-slate-900 flex items-center justify-center overflow-hidden">
            
            <!-- Gambar Hero Background -->
            <img src="hero.jpg" alt="Hero Background" class="absolute inset-0 w-full h-full object-cover object-center">
            
            <!-- Dark Overlay (Membuat gambar lebih gelap agar teks terbaca jelas) -->
            <div class="absolute inset-0 bg-black/60 backdrop-blur-[1px]"></div>

            <!-- Teks Nama Besar & Subtitle di Tengah Banner -->
            <div class="relative z-10 text-center px-6">
                <h2 class="text-3xl md:text-5xl lg:text-6xl font-extrabold text-white tracking-tight drop-shadow-lg">
                    Nisa Sri Fadilah
                </h2>
                <p class="text-sm md:text-lg text-slate-300 font-light tracking-wide mt-2 drop-shadow">
                    Industrial Engineering
                </p>
            </div>

        </div>

    </div>

</body>
</html>
