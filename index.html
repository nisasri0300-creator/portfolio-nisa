<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nisa Sri Fadilah - Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #e8e2d5; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
        }

        /* Tombol Kapsul Khas Desain Kamu */
        .custom-btn {
            background-color: #FAF6F0;
            border: 1.5px solid #E8DFD5;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04);
            color: #4A5568;
            transition: all 0.2s ease-in-out;
        }

        .custom-btn:hover {
            background-color: #F3ECE2;
            transform: translateY(-1px);
            box-shadow: 0 6px 10px -1px rgba(0, 0, 0, 0.08);
            color: #1A202C;
        }
    </style>
</head>
<body>

    <!-- Main Container Card (Mengikuti proporsi dan sudut melengkung desain kamu) -->
    <div class="max-w-[1100px] w-full bg-[#FDFBF7] rounded-[24px] overflow-hidden shadow-2xl m-4 grid grid-cols-1 md:grid-cols-12 min-h-[600px]">
        
        <!-- Sisi Kiri: Panel Sidebar (Warna Cream Terang Sesuai Desain Kamu) -->
        <div class="md:col-span-5 lg:col-span-4 p-8 flex flex-col justify-between items-center text-center bg-[#FDFBF7] border-r border-[#E8DFD5]">
            
            <div class="w-full flex flex-col items-center">
                <!-- Hamburger Menu Icon (Kiri Atas) -->
                <div class="w-full flex justify-start mb-2">
                    <button class="text-gray-700 hover:text-black transition">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                </div>

                <!-- Foto Profil (Memakai profile.jpg) -->
                <div class="w-20 h-20 rounded-full overflow-hidden mb-4 border border-gray-200 shadow-sm">
                    <img src="profile.jpg" alt="Nisa Sri Fadilah" class="w-full h-full object-cover">
                </div>

                <!-- Nama -->
                <h1 class="text-xl font-bold text-[#2D3748] tracking-tight">Nisa Sri Fadilah</h1>
                
                <!-- Social Media Icons (Memakai Warna Khas Kamu & Bisa Diklik) -->
                <div class="flex space-x-3 my-3 text-[#A08875]">
                    <a href="https://github.com/username" target="_blank" class="hover:text-[#6B5748] transition"><i class="fa-brands fa-github text-lg"></i></a>
                    <a href="https://linkedin.com/in/username" target="_blank" class="hover:text-[#6B5748] transition"><i class="fa-brands fa-linkedin-in text-lg"></i></a>
                    <a href="https://instagram.com/username" target="_blank" class="hover:text-[#6B5748] transition"><i class="fa-brands fa-instagram text-lg"></i></a>
                </div>

                <!-- Teks Deskripsi Kamu -->
                <p class="text-[11px] text-[#718096] max-w-[220px] mb-6 leading-relaxed">
                    Welcome to my portfolio. Explore my professional background and featured work below.
                </p>

                <!-- Tombol Navigasi Kapsul Kamu (Bisa Diklik) -->
                <div class="w-full space-y-3 max-w-[240px]">
                    <a href="link-cv-kamu.pdf" target="_blank" class="custom-btn block w-full py-2.5 text-xs font-semibold rounded-full text-center">
                        View CV
                    </a>
                    <a href="https://drive.google.com/..." target="_blank" class="custom-btn block w-full py-2.5 text-xs font-semibold rounded-full text-center">
                        Portfolio
                    </a>
                    <a href="#projects" class="custom-btn block w-full py-2.5 text-xs font-semibold rounded-full text-center">
                        Projects
                    </a>
                    <a href="#about" class="custom-btn block w-full py-2.5 text-xs font-semibold rounded-full text-center">
                        About
                    </a>
                </div>
            </div>

            <!-- Footer / Copyright -->
            <div class="mt-6 text-[10px] text-[#A0AEC0]">
                2026 made by Nisa
            </div>
        </div>

        <!-- Sisi Kanan: Banner Hero (Memakai hero.jpg + Teks Overlay ala Dion) -->
        <div class="md:col-span-7 lg:col-span-8 relative bg-[#E8E2D5] min-h-[350px] md:min-h-full flex items-center justify-center overflow-hidden">
            
            <!-- Gambar Hero Kamu -->
            <img src="hero.jpg" alt="Hero Background" class="absolute inset-0 w-full h-full object-cover object-center">
            
            <!-- Soft Overlay agar teks di tengah tetap terbaca jelas -->
            <div class="absolute inset-0 bg-black/20"></div>

            <!-- Teks Nama Besar & Subtitle ala Dion -->
            <div class="relative z-10 text-center px-6 text-white drop-shadow-md">
                <h2 class="text-3xl md:text-5xl font-black tracking-wider uppercase">
                    Nisa Sri Fadilah
                </h2>
                <p class="text-xs md:text-sm tracking-[0.2em] font-light mt-1 uppercase">
                    Industrial Engineering
                </p>
            </div>

        </div>

    </div>

</body>
</html>
