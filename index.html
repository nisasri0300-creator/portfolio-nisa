<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nisa Sri Fadilah - Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#e8e2d5] min-h-screen p-3 md:p-6 flex items-center justify-center">

    <div class="max-w-6xl w-full bg-[#f8f6f0] rounded-3xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-12 min-h-[500px] border border-white/40">
        
        <!-- Sidebar Kiri -->
        <div class="md:col-span-4 bg-white/80 backdrop-blur-md p-6 flex flex-col justify-between border-r border-stone-200/50 z-20">
            <div>
                <div class="flex justify-between items-center mb-5">
                    <button class="p-2 hover:bg-stone-200/50 rounded-lg transition">
                        <i class="fa-solid fa-bars text-xl text-stone-700"></i>
                    </button>
                </div>

                <div class="text-center mb-5">
                    <!-- Foto Profil Bulat -->
                    <div class="w-20 h-20 mx-auto rounded-full overflow-hidden border-2 border-stone-300 shadow-md mb-3 bg-stone-200">
                        <img src="profile.jpg" alt="Nisa Sri Fadilah" class="w-full h-full object-cover">
                    </div>
                    <h2 class="text-lg font-bold text-stone-800">Nisa Sri Fadilah</h2>
                    
                    <div class="flex justify-center space-x-2 mt-2 text-stone-600">
                        <a href="#" class="w-7 h-7 rounded-full border border-stone-300 flex items-center justify-center hover:bg-stone-800 hover:text-white transition"><i class="fa-brands fa-github text-xs"></i></a>
                        <a href="#" class="w-7 h-7 rounded-full border border-stone-300 flex items-center justify-center hover:bg-stone-800 hover:text-white transition"><i class="fa-brands fa-linkedin-in text-xs"></i></a>
                        <a href="#" class="w-7 h-7 rounded-full border border-stone-300 flex items-center justify-center hover:bg-stone-800 hover:text-white transition"><i class="fa-brands fa-instagram text-xs"></i></a>
                    </div>
                </div>

                <p class="text-[11px] text-center text-stone-500 mb-5 leading-relaxed px-2">
                    Welcome to my portfolio. Explore my professional background and featured work below.
                </p>

                <div class="space-y-2.5">
                    <a href="#cv" class="block w-full py-2 text-center text-stone-700 bg-white hover:bg-stone-50 rounded-xl border border-stone-200/80 shadow-sm font-medium text-xs transition">View CV</a>
                    <a href="#portfolio" class="block w-full py-2 text-center text-stone-700 bg-white hover:bg-stone-50 rounded-xl border border-stone-200/80 shadow-sm font-medium text-xs transition">Portfolio</a>
                    <a href="#projects" class="block w-full py-2 text-center text-stone-700 bg-white hover:bg-stone-50 rounded-xl border border-stone-200/80 shadow-sm font-medium text-xs transition">Projects</a>
                    <a href="#about" class="block w-full py-2 text-center text-stone-700 bg-white hover:bg-stone-50 rounded-xl border border-stone-200/80 shadow-sm font-medium text-xs transition">About</a>
                </div>
            </div>
        </div>

        <!-- Area Kanan (Teks Kanan Atas + Foto Besar Mepet Bawah) -->
        <div class="md:col-span-8 relative bg-white flex flex-col justify-between overflow-hidden p-6 md:p-8 min-h-[450px]">
            
            <!-- Teks Nama Pojok Kanan Atas -->
            <div class="text-right z-10 pt-2 pr-2">
                <h1 class="text-2xl md:text-4xl font-extrabold text-stone-600 tracking-wider uppercase mb-0.5">
                    NISA SRI FADILAH
                </h1>
                <p class="text-stone-400 text-[10px] md:text-xs font-semibold tracking-[0.2em] uppercase">
                    INDUSTRIAL ENGINEERING
                </p>
            </div>

            <!-- Foto Hero Besar & Mepet Bawah -->
            <img src="hero.jpg" alt="Nisa Sri Fadilah" class="absolute bottom-0 left-1/2 -translate-x-1/2 md:left-12 md:translate-x-0 w-auto h-[95%] max-h-[480px] object-contain object-bottom pointer-events-none">

        </div>

    </div>

</body>
</html>
