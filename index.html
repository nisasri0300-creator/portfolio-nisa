<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nisa Sri Fadilah - Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #e8e2d5; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
        }
    </style>
</head>
<body>

    <div style="max-width: 1100px; width: 100%; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); position: relative;">
        
        <!-- Gambar Portofolio dengan atribut usemap -->
        <img src="PORTOFOLIO NISA.jpg" usemap="#portfolio-map" alt="Portfolio Nisa" style="width: 100%; height: auto; display: block;">

        <!-- Peta Area Klik Tombol -->
        <map name="portfolio-map">
            <!-- Icon Sosial Media -->
            <!-- GitHub -->
            <area shape="circle" coords="100,230,20" href="https://github.com/username-kamu" target="_blank" alt="GitHub">
            <!-- LinkedIn -->
            <area shape="circle" coords="145,230,20" href="https://linkedin.com/in/username-kamu" target="_blank" alt="LinkedIn">
            <!-- Instagram -->
            <area shape="circle" coords="190,230,20" href="https://instagram.com/username-kamu" target="_blank" alt="Instagram">

            <!-- Tombol Navigasi Utama -->
            <!-- View CV -->
            <area shape="rect" coords="50,350,240,390" href="link-cv-kamu.pdf" target="_blank" alt="View CV">
            <!-- Portfolio -->
            <area shape="rect" coords="50,405,240,445" href="link-portfolio-kamu" target="_blank" alt="Portfolio">
            <!-- Projects -->
            <area shape="rect" coords="50,460,240,500" href="link-projects-kamu" target="_blank" alt="Projects">
            <!-- About -->
            <area shape="rect" coords="50,515,240,555" href="link-about-kamu" target="_blank" alt="About">
        </map>

    </div>

</body>
</html>
