<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nisa Sri Fadilah - Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FBF9F5;
            color: #1A202C;
            overflow-x: hidden;
        }
        .hero-bg {
            background-image: url('hero.jpg'); /* Ganti dengan nama file foto kamu */
            background-size: cover;
            background-position: center 20%;
        }
        #role-text {
            transition: opacity 0.3s ease-in-out;
        }
    </style>
</head>
<body class="relative min-h-screen flex bg-[#FBF9F5]">

    <!-- Sidebar / Drawer Navigasi (Gaya Editorial Minimalis) -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-[#F7F4EE] border-r border-[#E6DEC9] flex flex-col justify-between p-8 transition-all duration-300">
        <div>
            <!-- Header Sidebar -->
            <div class="flex items-center justify-between mb-10">
                <span class="text-[10px] uppercase tracking-[0.25em] text-slate-400 font-semibold">NAVIGATION</span>
                <button onclick="toggleSidebar()" class="w-7 h-7 rounded-full hover:bg-[#EAE2CE] flex items-center justify-center text-slate-500 transition-colors">✕</button>
            </div>
            
            <!-- Profil Singkat di Sidebar -->
            <div class="flex flex-col items-center text-center mb-10 pb-8 border-b border-[#EAE2CE]">
                <img src="profile.jpg" alt="Profile" class="w-16 h-16 rounded-full object-cover shadow-sm mb-3 border border-white">
                <h3 class="font-semibold text-slate-900 text-base tracking-wide">Nisa Sri Fadilah</h3>
                <p class="text-[9px] uppercase tracking-[0.2em] text-slate-400 font-medium mt-1">CREATIVE DIRECTOR</p>
            </div>

            <!-- Menu List (Gaya Tautan Bersih & Elegan, Tanpa Kotak Tebal) -->
            <nav class="space-y-1">
                <!-- Home (Aktif: Aksen Garis & Teks Tebal) -->
                <a href="#" class="flex items-center gap-4 px-3 py-2.5 bg-[#EFE8D6] text-slate-900 rounded-lg font-medium text-sm transition-all">
                    <svg class="w-4 h-4 text-slate-800" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    Home
                </a>
                <!-- Logo Gallery -->
                <a href="#" class="flex items-center gap-4 px-3 py-2.5 hover:bg-[#EFE8D6]/50 text-slate-600 hover:text-slate-900 rounded-lg font-medium text-sm transition-all">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    Logo Gallery
                </a>
                <!-- Branding Showcase -->
                <a href="#" class="flex items-center gap-4 px-3 py-2.5 hover:bg-[#EFE8D6]/50 text-slate-600 hover:text-slate-900 rounded-lg font-medium text-sm transition-all">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                    Branding Showcase
                </a>
                <!-- Projects -->
                <a href="#" class="flex items-center gap-4 px-3 py-2.5 hover:bg-[#EFE8D6]/50 text-slate-600 hover:text-slate-900 rounded-lg font-medium text-sm transition-all">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
                    Projects
                </a>
                <!-- About Me -->
                <a href="#" class="flex items-center gap-4 px-3 py-2.5 hover:bg-[#EFE8D6]/50 text-slate-600 hover:text-slate-900 rounded-lg font-medium text-sm transition-all">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    About Me
                </a>
            </nav>
        </div>

        <!-- Tombol Download Resume di Bawah Sidebar -->
        <div>
            <a href="#" class="flex items-center justify-between w-full px-4 py-2.5 bg-[#EFE8D6]/60 hover:bg-[#EFE8D6] border border-[#E0D5BE] rounded-lg text-slate-800 font-medium text-xs tracking-wider transition-colors">
                <span>DOWNLOAD RESUME</span>
                <span>↓</span>
            </a>
        </div>
    </aside>

    <!-- Tombol Menu Hamburger (Muncul jika sidebar ditutup) -->
    <button id="menu-btn" onclick="toggleSidebar()" class="fixed top-6 left-6 z-40 w-11 h-11 bg-white/90 hover:bg-white backdrop-blur-md rounded-full items-center justify-center shadow-sm transition-all hidden border border-slate-200">
        <svg class="w-5 h-5 text-slate-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>

    <!-- Main Hero Section (Tanpa Blur, Foto Tetap Tajam & Bersih) -->
    <main id="main-content" class="relative flex-1 h-screen hero-bg flex flex-col items-center justify-end pb-16 px-4 ml-72 transition-all duration-300 overflow-hidden">
        
        <!-- Konten Nama & Title -->
        <div class="relative z-10 text-center max-w-4xl mx-auto flex flex-col items-center mb-6">
            <!-- Nama Besar -->
            <h1 class="text-3xl sm:text-5xl md:text-6xl font-black tracking-widest text-[#121c2e] uppercase drop-shadow-[0_2px_10px_rgba(255,255,255,0.9)] mb-3">
                NISA SRI FADILAH
            </h1>

            <!-- Pill Badge Subtitle Berganti Otomatis -->
            <div class="inline-flex items-center px-6 py-2 bg-white/95 backdrop-blur-md rounded-full shadow-sm border border-white/60">
                <span id="role-text" class="text-xs sm:text-sm font-bold tracking-widest text-slate-800 uppercase">
                    INDUSTRIAL ENGINEERING
                </span>
            </div>
        </div>

    </main>

    <!-- Script Pendukung Interaksi -->
    <script>
        let isSidebarOpen = true;

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            const menuBtn = document.getElementById('menu-btn');

            isSidebarOpen = !isSidebarOpen;

            if (isSidebarOpen) {
                sidebar.classList.remove('-translate-x-full');
                mainContent.classList.add('ml-72');
                menuBtn.classList.remove('flex');
                menuBtn.classList.add('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                mainContent.classList.remove('ml-72');
                menuBtn.classList.remove('hidden');
                menuBtn.classList.add('flex');
            }
        }

        // Animasi Teks Berganti pada Pill Badge
        const roles = [
            "INDUSTRIAL ENGINEERING",
            "EDUCATION TEACHER",
            "E-COMMERCE SPECIALIST",
            "DIGITAL MARKETING"
        ];
        let currentRoleIndex = 0;

        setInterval(() => {
            currentRoleIndex = (currentRoleIndex + 1) % roles.length;
            const roleElement = document.getElementById('role-text');
            if (roleElement) {
                roleElement.style.opacity = '0';
                setTimeout(() => {
                    roleElement.textContent = roles[currentRoleIndex];
                    roleElement.style.opacity = '1';
                }, 200);
            }
        }, 3500);
    </script>
</body>
</html>
