<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nisa Sri Fadilah - Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#e8e2d5] min-h-screen flex items-center justify-center p-4">

    <!-- Container Utama -->
    <div class="max-w-5xl w-full bg-white rounded-3xl shadow-xl overflow-hidden grid grid-cols-1 md:grid-cols-12 min-h-[550px]">
        
        <!-- Sisi Kiri: Profil & Navigasi -->
        <div class="md:col-span-5 p-8 flex flex-col justify-between items-center text-center bg-white border-r border-gray-100">
            <div class="w-full flex flex-col items-center">
                <!-- Foto Profil -->
                <div class="w-24 h-24 rounded-full overflow-hidden border-2 border-gray-200 mb-4 shadow-sm">
                    <img src="foto-profil.jpg" alt="Nisa Sri Fadilah" class="w-full h-full object-cover">
                </div>

                <!-- Nama & Deskripsi -->
                <h1 class="text-2xl font-bold text-gray-800">Nisa Sri Fadilah</h1>
                
                <!-- Icon Sosial Media -->
                <div class="flex space-x-3 my-3 text-gray-600">
                    <a href="#" class="p-2 rounded-full hover:bg-gray-100 transition"><i class="fab font-bold fa-github"></i></a>
                    <a href="#" class="p-2 rounded-full hover:bg-gray-100 transition"><i class="fab fa-linkedin"></i></a>
                    <a href="#" class="p-2 rounded-full hover:bg-gray-100 transition"><i class="fab fa-instagram"></i></a>
                </div>

                <p class="text-xs text-gray-500 max-w-xs mb-6">
                    Welcome to my portfolio. Explore my professional background and featured work below.
                </p>

                <!-- Menu Tombol Navigasi -->
                <div class="w-full space-y-3 max-w-xs">
                    <a href="#cv" class="block w-full py-2.5 px-4 text-sm font-medium text-gray-700 border border-gray-300 rounded-full hover:bg-gray-50 transition text-center">View CV</a>
                    <a href="#portfolio" class="block w-full py-2.5 px-4 text-sm font-medium text-gray-700 border border-gray-300 rounded-full hover:bg-gray-50 transition text-center">Portfolio</a>
                    <a href="#projects" class="block w-full py-2.5 px-4 text-sm font-medium text-gray-700 border border-gray-300 rounded-full hover:bg-gray-50 transition text-center">Projects</a>
                    <a href="#about" class="block w-full py-2.5 px-4 text-sm font-medium text-gray-700 border border-gray-300 rounded-full hover:bg-gray-50 transition text-center">About</a>
                </div>
            </div>
        </div>

        <!-- Sisi Kanan: Hero Banner / Foto Besar -->
        <div class="md:col-span-7 relative min-h-[300px] md:min-h-full bg-cover bg-center flex items-center justify-center" style="background-image: url('foto-hero.jpg');">
            <!-- Overlay tipis agar teks lebih terbaca -->
            <div class="absolute inset-0 bg-black/10"></div>
            
            <!-- Headline Teks -->
            <div class="relative z-10 text-center text-white px-4">
                <h2 class="text-4xl md:text-5xl font-black tracking-wider drop-shadow-md">NISA SRI FADILAH</h2>
                <p class="text-sm md:text-base tracking-widest font-light mt-1 drop-shadow">INDUSTRIAL ENGINEERING</p>
            </div>
        </div>

    </div>

</body>
</html>
