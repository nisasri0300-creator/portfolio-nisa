<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Saya</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(to bottom, #1e293b, var(--bg-color));
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--accent-color);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        section {
            margin-bottom: 4rem;
        }

        h2 {
            border-bottom: 2px solid var(--card-bg);
            padding-bottom: 0.5rem;
            margin-bottom: 2rem;
            font-size: 1.8rem;
            color: var(--accent-color);
        }

        /* Grid untuk Poster Design Templates */
        .poster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .poster-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .poster-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.4);
        }

        .poster-card img {
            width: 100%;
            height: auto;
            display: block;
            aspect-ratio: 3/4;
            object-fit: cover;
        }

        .poster-info {
            padding: 1rem;
            text-align: center;
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 2rem;
            background-color: var(--card-bg);
            color: var(--text-muted);
            margin-top: 4rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Portofolio Kreatif</h1>
        <p>Kumpulan Karya Desain Poster dan Proyek Pilihan</p>
    </header>

    <main>
        <!-- Bagian Poster Design Templates -->
        <section>
            <h2>Poster Design Templates</h2>
            <div class="poster-grid">
                <!-- Poster 1 -->
                <div class="poster-card">
                    <img src="POSTER 1.png" alt="Poster Design 1">
                    <div class="poster-info">Poster 1</div>
                </div>
                <!-- Poster 2 -->
                <div class="poster-card">
                    <img src="POSTER 2.png" alt="Poster Design 2">
                    <div class="poster-info">Poster 2</div>
                </div>
                <!-- Poster 3 -->
                <div class="poster-card">
                    <img src="POSTER 3.png" alt="Poster Design 3">
                    <div class="poster-info">Poster 3</div>
                </div>
                <!-- Poster 4 -->
                <div class="poster-card">
                    <img src="POSTER 4.png" alt="Poster Design 4">
                    <div class="poster-info">Poster 4</div>
                </div>
                <!-- Poster 5 -->
                <div class="poster-card">
                    <img src="POSTER 5.png" alt="Poster Design 5">
                    <div class="poster-info">Poster 5</div>
                </div>
                <!-- Poster 6 -->
                <div class="poster-card">
                    <img src="POSTER 6.png" alt="Poster Design 6">
                    <div class="poster-info">Poster 6</div>
                </div>
                <!-- Poster 7 -->
                <div class="poster-card">
                    <img src="POSTER 7.png" alt="Poster Design 7">
                    <div class="poster-info">Poster 7</div>
                </div>
                <!-- Poster 8 -->
                <div class="poster-card">
                    <img src="POSTER 8.png" alt="Poster Design 8">
                    <div class="poster-info">Poster 8</div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Portofolio Saya. All rights reserved.</p>
    </footer>

</body>
</html>
