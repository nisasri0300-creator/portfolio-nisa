<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nisa Sri Fadilah - Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#e8e2d5] min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div class="max-w-6xl w-full bg-[#f4f0ea] rounded-3xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-12 min-h-[600px] border border-white/40">
        
        <!-- Sidebar Kiri -->
        <div class="md:col-span-4 bg-white/70 backdrop-blur-md p-6 flex flex-col justify-between border-r border-stone-200/50">
            <div>
                <div class="flex justify-between items-center mb-6">
                    <button class="p-2 hover:bg-stone-200/50 rounded-lg transition">
                        <i class="fa-solid fa-bars text-xl text-stone-700"></i>
                    </button>
                </div>

                <div class="text-center mb-6">
                    <!-- Foto Profil Bulat -->
                    <div class="w-24 h-24 mx-auto rounded-full overflow-hidden border-2 border-stone-300 shadow-md mb-4 bg-stone-200">
                        <img src="profile.jpg" alt="Nisa Sri Fadilah" class="w-full h-full object-cover">
                    </div>
                    <h2 class="text-xl font-bold text-stone-800">Nisa Sri Fadilah</h2>
                    
                    <div class="flex justify-center space-x-3 mt-3 text-stone-600">
                        <a href="#" class="w-8 h-8 rounded-full border border-stone-300 flex items-center justify-center hover:bg-stone-800 hover:text-white transition"><i class="fa-brands fa-github text-sm"></i></a>
                        <a href="#" class="w-8 h-8 rounded-full border border-stone-300 flex items-center justify-center hover:bg-stone-800 hover:text-white transition"><i class="fa-brands fa-linkedin-in text-sm"></i></a>
                        <a href="#" class="w-8 h-8 rounded-full border border-stone-300 flex items-center justify-center hover:bg-stone-800 hover:text-white transition"><i class="fa-brands fa-instagram text-sm"></i></a>
                    </div>
                </div>

                <p class="text-xs text-center text-stone-500 mb-6 leading-relaxed px-2">
                    Welcome to my portfolio. Explore my professional background and featured work below.
                </p>

                <div class="space-y-3">
                    <a href="#cv" class="block w-full py-2.5 text-center text-stone-700 bg-white/80 hover:bg-white rounded-2xl border border-stone-200/80 shadow-sm font-medium text-sm transition">View CV</a>
                    <a href="#portfolio" class="block w-full py-2.5 text-center text-stone-700 bg-white/80 hover:bg-white rounded-2xl border border-stone-200/80 shadow-sm font-medium text-sm transition">Portfolio</a>
                    <a href="#projects" class="block w-full py-2.5 text-center text-stone-700 bg-white/80 hover:bg-white rounded-2xl border border-stone-200/80 shadow-sm font-medium text-sm transition">Projects</a>
                    <a href="#about" class="block w-full py-2.5 text-center text-stone-700 bg-white/80 hover:bg-white rounded-2xl border border-stone-200/80 shadow-sm font-medium text-sm transition">About</a>
                </div>
            </div>
        </div>

        <!-- Bahagian Utama / Gambar Kanan -->
        <div class="md:col-span-8 relative flex flex-col items-center justify-center p-8 text-center min-h-[400px] overflow-hidden">
            <!-- Background Foto Hero -->
            <img src="hero.jpg" alt="Nisa Sri Fadilah" class="absolute inset-0 w-full h-full object-cover object-center">
            
            <!-- Teks Nama di Atas Foto -->
            <div class="relative z-10">
                <h1 class="text-4xl md:text-6xl font-black text-white tracking-widest drop-shadow-lg mb-2 uppercase">
                    NISA SRI FADILAH
                </h1>
                <p class="text-white/90 text-sm md:text-base tracking-[0.2em] font-semibold uppercase drop-shadow-md">
                    Industrial Engineering
                </p>
            </div>
        </div>

    </div>

</body>
</html>
